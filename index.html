<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Student Planner</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app-container">
        <!-- Sidebar / Form Section -->
        <aside class="sidebar">
            <h2>Add New Task</h2>
            <form id="task-form">
                <label for="task-title">Task Title</label>
                <input type="text" id="task-title" required placeholder="Enter task title">

                <label for="task-deadline">Deadline</label>
                <input type="date" id="task-deadline" required>

                <label for="task-course">Course Name</label>
                <input type="text" id="task-course" required placeholder="e.g., Computer Science">

                <label for="task-category">Task Category</label>
                <select id="task-category">
                    <option value="Homework">Homework</option>
                    <option value="Project">Project</option>
                    <option value="Exam">Exam</option>
                </select>

                <label for="task-priority">Priority Level</label>
                <select id="task-priority">
                    <option value="Low">Low</option>
                    <option value="Medium" selected>Medium</option>
                    <option value="High">High</option>
                </select>

                <button type="submit" class="btn-primary">Add Task</button>
            </form>

            <div class="quick-actions">
                <h3>Quick Actions</h3>
                <button id="clear-completed" class="btn-secondary">Clear Completed Tasks</button>
                <button id="delete-all" class="btn-danger">Delete All Tasks</button>
            </div>
        </aside>

        <!-- Main Content Section -->
        <main class="main-content">
            <header>
                <h1>🎓 My Student Planner</h1>
                <p>Welcome to your personal web-based task manager!</p>
            </header>

            <section class="task-section">
                <h2>📋 Your Tasks</h2>
                <div id="task-list" class="task-grid">
                    <p class="no-tasks">No tasks found yet. Add one using the sidebar!</p>
                </div>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>

</html>
