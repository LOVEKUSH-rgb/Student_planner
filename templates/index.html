<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Student Planner</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <div class="app-container">
        <!-- Sidebar / Forms Section -->
        <aside class="sidebar">
            <h2>Add New Task</h2>
            <form id="task-form">
                <label for="task-title">Task Title</label>
                <input type="text" id="task-title" required placeholder="Enter task title">

                <label for="task-deadline">Deadline</label>
                <input type="date" id="task-deadline" required>

                <label for="task-course">Course Name</label>
                <input type="text" id="task-course" required placeholder="e.g., Computer Science">

                <label for="task-category">Task Category</label>
                <select id="task-category">
                    <option value="Homework">Homework</option>
                    <option value="Project">Project</option>
                    <option value="Exam">Exam</option>
                </select>

                <label for="task-priority">Priority Level</label>
                <select id="task-priority">
                    <option value="Low">Low</option>
                    <option value="Medium" selected>Medium</option>
                    <option value="High">High</option>
                </select>

                <button type="submit" class="btn-primary">Add Task</button>
            </form>

            <hr style="border: 0; border-top: 1px solid #30363d; margin: 20px 0;">

            <h2>Add Class Schedule</h2>
            <form id="schedule-form">
                <label for="class-name">Course/Subject</label>
                <input type="text" id="class-name" required placeholder="e.g., Data Structures">

                <label for="class-day">Day of Week</label>
                <select id="class-day">
                    <option value="Monday">Monday</option>
                    <option value="Tuesday">Tuesday</option>
                    <option value="Wednesday">Wednesday</option>
                    <option value="Thursday">Thursday</option>
                    <option value="Friday">Friday</option>
                </select>

                <label for="class-time">Time</label>
                <input type="text" id="class-time" required placeholder="e.g., 10:00 AM - 11:30 AM">

                <button type="submit" class="btn-secondary">Add to Timetable</button>
            </form>

            <div class="quick-actions" style="margin-top: 20px;">
                <h3>Quick Actions</h3>
                <button id="clear-completed" class="btn-secondary">Clear Completed Tasks</button>
                <button id="delete-all" class="btn-danger">Delete All Data</button>
            </div>
        </aside>

        <!-- Main Content Section -->
        <main class="main-content">
            <header>
                <h1>🎓 My Student Planner & Timetable</h1>
                <p>Your ultimate academic productivity hub</p>
            </header>

            <!-- Dashboard Statistics Cards -->
            <section class="stats-container">
                <div class="stat-card">
                    <h3>Total Tasks</h3>
                    <p id="stat-total">0</p>
                </div>
                <div class="stat-card">
                    <h3>Pending</h3>
                    <p id="stat-pending">0</p>
                </div>
                <div class="stat-card">
                    <h3>Completed</h3>
                    <p id="stat-completed">0</p>
                </div>
            </section>

            <!-- Search and Filter Section -->
            <section class="filter-section">
                <input type="text" id="search-input" placeholder="🔍 Search tasks by title...">
                <select id="filter-category">
                    <option value="All">All Categories</option>
                    <option value="Homework">Homework</option>
                    <option value="Project">Project</option>
                    <option value="Exam">Exam</option>
                </select>
            </section>

            <div class="content-split">
                <!-- Task Manager View -->
                <section class="task-section" style="flex: 1;">
                    <h2>📋 Your Tasks</h2>
                    <div id="task-list" class="task-grid">
                        <p class="no-tasks">No tasks found yet. Add one using the sidebar!</p>
                    </div>
                </section>

                <!-- Daily Timetable View -->
                <section class="timetable-section" style="flex: 1;">
                    <h2>📅 Class Timetable</h2>
                    <div id="timetable-list" class="task-grid">
                        <p class="no-tasks">No classes scheduled yet.</p>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>

</html>
